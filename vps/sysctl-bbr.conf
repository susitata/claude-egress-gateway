# Congestion control: BBR instead of cubic.
#
# On a high-RTT, lossy path cubic collapses to a few KB/s per stream; BBR
# saturates the path instead. Measured 14 KB/s -> 217 KB/s on the same route.
#
# IMPORTANT: the algorithm is chosen at connection establishment. After
# applying this, existing SSH sessions keep using cubic -- rebuild the tunnel.
net.ipv4.tcp_congestion_control = bbr

# Fair queueing gives BBR pacing; without it the gain is smaller.
net.core.default_qdisc = fq
